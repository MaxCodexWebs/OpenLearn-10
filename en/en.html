    <style>
        body {
            background-color: #1a1714;

        }

        button {
            width: 100%;
            background-color: #383025;
            color: #f3efe6;
            border: 1px solid #574a38;
            border-radius: 6px;
            padding: 12px 16px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        button:hover {
            background-color: #f3c623;
            color: #1a1714;
            border-color: #f3c623;
            font-weight: 600;
        }

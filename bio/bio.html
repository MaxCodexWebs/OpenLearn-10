    <script>
        window.addEventListener('load', function() {
            const canvas = document.getElementById('dnaCanvas');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // DNA helix parameters
            let angle = 0;
            const pointsCount = 35;
            
            function animateDNA() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const width = canvas.width;
                const height = canvas.height;
                
                // Center the DNA strand vertically or let it flow across
                const centerY = height / 2;
                const amplitude = Math.min(width * 0.25, 140);
                const wavelength = 0.04;

                for (let i = 0; i < pointsCount; i++) {
                    const currentY = (i / pointsCount) * height * 1.2 - (height * 0.1);
                    const currentAngle = angle + i * 0.25;

                    // Calculate dual strand X coordinates
                    const x1 = (width / 2) + Math.sin(currentAngle) * amplitude;
                    const x2 = (width / 2) - Math.sin(currentAngle) * amplitude;

                    // Draw connecting base pairs periodically
                    if (i % 2 === 0) {
                        ctx.beginPath();
                        ctx.moveTo(x1, currentY);
                        ctx.lineTo(x2, currentY);
                        ctx.strokeStyle = 'rgba(139, 92, 246, 0.12)';
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                    }

                    // Draw Strand 1 Node (Green)
                    const radius1 = 2.5 + Math.cos(currentAngle) * 1.5;
                    ctx.beginPath();
                    ctx.arc(x1, currentY, Math.max(1, radius1 + 1), 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(16, 185, 129, 0.75)';
                    ctx.shadowColor = '#10B981';
                    ctx.shadowBlur = 8;
                    ctx.fill();

                    // Draw Strand 2 Node (Purple)
                    const radius2 = 2.5 - Math.cos(currentAngle) * 1.5;
                    ctx.beginPath();
                    ctx.arc(x2, currentY, Math.max(1, radius2 + 1), 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(139, 92, 246, 0.75)';
                    ctx.shadowColor = '#8B5CF6';
                    ctx.shadowBlur = 8;
                    ctx.fill();
                }

                ctx.shadowBlur = 0; // reset shadow for performance
                angle += 0.015;
                requestAnimationFrame(animateDNA);
            }

            animateDNA();
        });
    </script>
